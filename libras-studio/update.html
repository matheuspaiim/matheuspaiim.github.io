<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3cff"><title>Atualizando Libras Studio</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f4ff;font-family:system-ui;color:#251c3c}.box{max-width:420px;margin:24px;padding:28px;text-align:center;background:#fff;border:1px solid #e7defc;border-radius:24px;box-shadow:0 18px 50px #5b35a71a}.logo{font-size:48px}.spin{width:34px;height:34px;border:4px solid #e5dcff;border-top-color:#7c3cff;border-radius:50%;animation:s .8s linear infinite;margin:18px auto}@keyframes s{to{transform:rotate(360deg)}}small{color:#746d84}</style></head><body><div class="box"><div class="logo">🖐️</div><h2>Atualizando Libras Studio</h2><div class="spin"></div><p id="status">Limpando somente o cache do Libras Studio…</p><small>Sua conta e seus dados não serão apagados.</small></div><script>(async()=>{try{if("serviceWorker"in navigator){let regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes("/libras-studio/")).map(r=>r.unregister()))}if("caches"in window){let keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith("libras-studio-mobile-")).map(k=>caches.delete(k)))}document.getElementById("status").textContent="Atualização pronta. Abrindo…";setTimeout(()=>location.replace("./?fresh="+Date.now()),700)}catch(e){document.getElementById("status").textContent="Não consegui limpar automaticamente. Feche e abra novamente.";console.error(e)}})();</script></body></html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7650e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Libras Studio</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="app">
    <section id="auth-view" class="screen auth-screen">
      <div class="logo">👐</div>
      <h1>Libras Studio</h1>
      <p>Seus sinais e revisões, agora no celular.</p>
      <form id="auth-form" class="card auth-card">
        <input id="email" type="email" placeholder="Seu e-mail" required autocomplete="email">
        <input id="password" type="password" placeholder="Sua senha" minlength="6" required autocomplete="current-password">
        <button class="primary" type="submit">Entrar</button>
        <button id="signup-btn" class="ghost" type="button">Criar conta</button>
        <small id="auth-status"></small>
      </form>
    </section>

    <section id="main-view" class="screen hidden">
      <header class="topbar">
        <div><b>👐 Libras Studio</b><small id="sync-status">offline</small></div>
        <button id="logout-btn" class="icon-btn" aria-label="Sair">↪</button>
      </header>

      <main id="content">
        <section id="home-tab" class="tab active">
          <div class="hero">
            <span>REVISÃO DE HOJE</span>
            <h2><b id="home-due">0</b> vencidos · <b id="home-new">0</b> novos</h2>
            <button class="primary" data-go="review">🧠 Revisar agora</button>
          </div>
          <div class="stats">
            <article><strong id="stat-signs">0</strong><span>Sinais</span></article>
            <article><strong id="stat-cats">0</strong><span>Categorias</span></article>
            <article><strong id="stat-today">0</strong><span>Hoje</span></article>
          </div>
        </section>

        <section id="library-tab" class="tab">
          <div class="title"><h2>📚 Biblioteca</h2><button id="refresh-btn" class="ghost small">↻</button></div>
          <input id="library-search" class="search" placeholder="Buscar sinal">
          <div id="library-list"></div>
        </section>

        <section id="review-tab" class="tab">
          <div id="review-setup">
            <h2>🧠 Revisar</h2>
            <select id="review-category"><option value="">Todas as categorias</option></select>
            <select id="review-mode">
              <option value="mixed">Vencidos + novos</option>
              <option value="due">Somente vencidos</option>
              <option value="new">Somente novos</option>
            </select>
            <button id="review-start" class="primary">Começar</button>
          </div>
          <div id="review-card" class="card hidden">
            <small>FAÇA O SINAL DE</small>
            <h2 id="review-name">Mãe</h2>
            <div id="review-media" class="media hidden"></div>
            <button id="review-reveal" class="primary">👁 Revelar</button>
            <div id="ratings" class="ratings hidden">
              <button data-rate="again">De novo<small>10 min</small></button>
              <button data-rate="hard">Difícil<small>6 h</small></button>
              <button data-rate="good">Bom<small>1 dia</small></button>
              <button data-rate="easy">Fácil<small>4 dias</small></button>
            </div>
          </div>
          <div id="review-done" class="card hidden center">🎉 Sessão concluída</div>
        </section>
      </main>

      <nav class="bottom-nav">
        <button class="active" data-tab="home">🏠<span>Início</span></button>
        <button data-tab="library">📚<span>Biblioteca</span></button>
        <button data-tab="review">🧠<span>Revisar</span></button>
      </nav>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.matheuspaiim.librasstudio'
    compileSdk 35

    defaultConfig {
        applicationId "com.matheuspaiim.librasstudio"
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName "0.4.13"
    }

    flavorDimensions += "edition"
    productFlavors {
        create("public") {
            dimension "edition"
            applicationId "com.matheuspaiim.librasstudio"
        }
        create("personal") {
            dimension "edition"
            applicationId "com.matheuspaiim.librasstudio.personal"
            versionNameSuffix "-personal"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}



def studioWebDir = file("../../libras-studio")
def bundledWebDir = file("src/main/assets/web")

tasks.register("syncWebAssets", Copy) {
    from(studioWebDir) {
        include "index.html"
        include "app.css"
        include "app.js"
        include "config.js"
        include "study.js"
        include "explore-data.js"
        include "phrase-data.js"
        include "manifest.webmanifest"
        include "icon.svg"
        include "version.json"
    }
    into bundledWebDir
    doFirst {
        delete bundledWebDir
    }
}

tasks.configureEach { task ->
    if (task.name == "preBuild") {
        task.dependsOn("syncWebAssets")
    }
}

name: Build Libras Studio Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "native-android/**"
      - "libras-studio/app.js"
      - "libras-studio/index.html"
      - "libras-studio/app.css"
      - "libras-studio/version.json"
      - ".github/workflows/build-libras-studio-android.yml"

permissions:
  contents: write

jobs:
  # Builds both Android editions and validates the live web shell before packaging.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate web application JavaScript
        run: |
          node --check ../libras-studio/app.js
          node - <<'NODE'
          const fs=require("fs");
          const src=fs.readFileSync("../libras-studio/app.js","utf8");
          const d=String.fromCharCode(36);
          if(src.includes(d.repeat(3)+"(")){
            console.error("Undefined triple-dollar selector helper found.");
            process.exit(1);
          }
          if(!src.includes('function go(v){'+d.repeat(2)+'(".view").forEach')){
            console.error("Navigation smoke check failed: go() is not using the multi-selector helper.");
            process.exit(1);
          }
          if(!src.includes(d.repeat(2)+'("nav [data-view]").forEach')){
            console.error("Navigation wiring smoke check failed.");
            process.exit(1);
          }
          NODE

      - name: Build public and personal APKs
        run: gradle :app:assemblePublicDebug :app:assemblePersonalDebug --stacktrace

      - name: Verify edition isolation
        run: |
          PUBLIC_APK="app/build/outputs/apk/public/debug/app-public-debug.apk"
          PERSONAL_APK="app/build/outputs/apk/personal/debug/app-personal-debug.apk"
          ANALYZER="$HOME/android-sdk/cmdline-tools/latest/bin/apkanalyzer"

          "$ANALYZER" manifest print "$PUBLIC_APK" > /tmp/public-manifest.xml
          "$ANALYZER" manifest print "$PERSONAL_APK" > /tmp/personal-manifest.xml

          if grep -q "LibrasLabAccessibilityService" /tmp/public-manifest.xml; then
            echo "ERROR: Public APK contains LibrasLab service"
            exit 1
          fi
          if grep -q "BIND_ACCESSIBILITY_SERVICE" /tmp/public-manifest.xml; then
            echo "ERROR: Public APK contains accessibility binding"
            exit 1
          fi
          if grep -q "com.toleio.brazil" /tmp/public-manifest.xml; then
            echo "ERROR: Public APK contains LibrasLab package visibility"
            exit 1
          fi

          grep -q "LibrasLabAccessibilityService" /tmp/personal-manifest.xml
          grep -q "BIND_ACCESSIBILITY_SERVICE" /tmp/personal-manifest.xml

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/public/debug/app-public-debug.apk ../Libras-Studio-Publico.apk
          cp app/build/outputs/apk/personal/debug/app-personal-debug.apk ../Libras-Studio-Pessoal.apk

      - name: Upload public APK
        uses: actions/upload-artifact@v4
        with:
          name: Libras-Studio-Publico
          path: Libras-Studio-Publico.apk
          retention-days: 30

      - name: Upload personal APK
        uses: actions/upload-artifact@v4
        with:
          name: Libras-Studio-Pessoal
          path: Libras-Studio-Pessoal.apk
          retention-days: 30

      - name: Publish public beta APK to GitHub Pages
        working-directory: .
        run: |
          mkdir -p libras-studio/downloads
          cp native-android/app/build/outputs/apk/public/debug/app-public-debug.apk libras-studio/downloads/LibrasStudio-Publico-beta.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libras-studio/downloads/LibrasStudio-Publico-beta.apk
          if git diff --cached --quiet; then
            echo "Public beta APK unchanged."
          else
            git commit -m "Publish Libras Studio public beta APK"
            git push
          fi

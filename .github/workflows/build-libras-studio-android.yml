name: Build Libras Studio Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "native-android/**"
      - ".github/workflows/build-libras-studio-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Libras-Studio-LibrasLab-Bridge.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Libras-Studio-LibrasLab-Bridge
          path: Libras-Studio-LibrasLab-Bridge.apk
          retention-days: 30

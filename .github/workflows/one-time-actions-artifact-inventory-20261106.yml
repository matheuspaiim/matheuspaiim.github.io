name: One-time read-only artifact inventory
on:
  push:
    branches: [maintenance/actions-inventory-only-20261106]
    paths: ['.github/workflows/one-time-actions-artifact-inventory-20261106.yml']
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    if: github.repository == 'matheuspaiim/matheuspaiim.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Count and list stored Actions artifacts read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='matheuspaiim/matheuspaiim.github.io'
          file=$(mktemp)
          : > "$file"
          page=1
          while [ "$page" -le 30 ]; do
            json="$(curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$repo/actions/artifacts?per_page=100&page=$page")"
            if [ "$page" -eq 1 ]; then echo "ARTIFACT_TOTAL_REPORTED=$(echo "$json" | jq '.total_count')"; fi
            echo "$json" | jq -cr '.artifacts[] | select(.expired==false) | {id,name,size_in_bytes,created_at,expires_at,workflow_run_id:(.workflow_run.id // null)}' >> "$file"
            count="$(echo "$json" | jq '.artifacts | length')"
            [ "$count" -lt 100 ] && break
            page=$((page+1))
          done
          echo "LIVE_COUNT=$(wc -l < "$file")"
          echo "LIVE_BYTES=$(jq -sr '[.[].size_in_bytes] | add // 0' "$file")"
          echo "TOP_START"
          jq -sr 'sort_by(.size_in_bytes)|reverse|.[:35]|.[]|"ART|id=\(.id)|bytes=\(.size_in_bytes)|name=\(.name)|run=\(.workflow_run_id)|created=\(.created_at)"' "$file"
          echo "GROUP_START"
          jq -sr 'group_by(.name)|map({name:.[0].name,count:length,bytes:(map(.size_in_bytes)|add)})|sort_by(.bytes)|reverse|.[:20]|.[]|"GROUP|name=\(.name)|count=\(.count)|bytes=\(.bytes)"' "$file"
          echo "INVENTORY_DONE_NO_DELETIONS"
